name: Operit2 Android Build

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: '源码仓库'
        required: true
        default: 'CWIFISB1/Operit2'
      source_ref:
        description: '源码分支/tag/commit'
        required: true
        default: 'main'
      publish_release:
        description: '构建成功后发布到 Release'
        required: true
        default: true
        type: boolean
      release_tag:
        description: 'Release 标签（留空自动用 build-<run_number>）'
        required: false
        default: ''

concurrency:
  group: build-${{ github.event.inputs.source_repo }}-${{ github.event.inputs.source_ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SRC: operit2-src
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.source_repo }}
          ref: ${{ github.event.inputs.source_ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: ${{ env.SRC }}
          fetch-depth: 1

      - name: 环境自检
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          echo "[版本]"; grep -E '^version:' apps/flutter/app/pubspec.yaml || true
          echo "[云机 buildType 主包]"; grep -n 'create("yunji")' apps/flutter/app/android/app/build.gradle.kts
          echo "[云机包名]"; grep -n 'com.yunjing.companion' apps/flutter/app/android/app/build.gradle.kts | head -4
          echo "[伴生包 buildType]"; grep -n 'create("yunji")' tools/android-accessibility/build.gradle.kts

      - name: 恢复固定签名
        working-directory: ${{ env.SRC }}
        env:
          KEYSTORE_B64: ${{ secrets.O2_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.O2_KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.O2_KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p tools/release/secrets
          echo "$KEYSTORE_B64" | base64 -d > tools/release/secrets/operit2-release.jks
          keytool -list -keystore tools/release/secrets/operit2-release.jks -storepass "$KEYSTORE_PASS" > /dev/null
          {
            echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/$SRC/tools/release/secrets/operit2-release.jks"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASS"
            echo "RELEASE_KEY_ALIAS=$KEYSTORE_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEYSTORE_PASS"
          } >> local.properties
          echo '[签名就绪]'
          keytool -list -v -keystore tools/release/secrets/operit2-release.jks -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -E 'SHA256:' | head -1

      - name: 安装 Linux 构建依赖
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ca-certificates curl git unzip xz-utils gzip tar bzip2 \
            gawk pkg-config flex diffutils patch \
            python3 python3-venv python3-pip \
            openjdk-17-jdk nodejs npm
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          node --version
          npm --version
          # corepack 不在 Ubuntu 的 apt 源里，官方分发方式是 npm 全局安装。
          sudo npm install -g corepack@latest 2>&1 | tail -3
          corepack --version

      - name: 安装 LLVM 21
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-21 libclang-21-dev lld-21
          clang-21 --version | head -1

      - name: 安装 Rust
        run: |
          set -euo pipefail
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustc --version
          rustup target add aarch64-linux-android

      - name: 安装 Flutter SDK
        run: |
          set -euo pipefail
          # fvm 需要先有 dart，而 dart 又来自 flutter，链条太长且易断；
          # 直接取 stable 分支的 Flutter，版本由 pubspec 的 sdk 约束把关。
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          export PATH="$HOME/flutter/bin:$PATH"
          flutter --version
          flutter config --no-analytics
          flutter precache --android 2>&1 | tail -3

      - name: 安装 Emscripten（usearch wasm 需要）
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          # character_cards 插件的 vendor/usearch 在 pack:toolpkg 阶段要编 wasm，
          # 缺 em++ 会直接 FileNotFoundError，整个插件同步失败。
          # 上游查找顺序：.ci-tools/emsdk 或环境变量 EMXX。
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .ci-tools/emsdk
          cd .ci-tools/emsdk
          ./emsdk install latest
          ./emsdk activate latest
          set +u
          source ./emsdk_env.sh
          set -u
          # build.py 优先读 EMXX，其次找 ROOT/.ci-tools/emsdk/upstream/emscripten/em++.py。
          # 这里两个都落实：EMXX 指向确切路径，emsdk 也装在它默认找的位置。
          EMXX_PATH="$(pwd)/upstream/emscripten/em++"
          test -x "$EMXX_PATH" || { echo "em++ not found at $EMXX_PATH" >&2; exit 1; }
          echo "EMXX=$EMXX_PATH" >> $GITHUB_ENV
          echo "$(pwd)/upstream/emscripten" >> $GITHUB_PATH
          "$EMXX_PATH" --version | head -1

      - name: 建 Python 虚拟环境
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python --version

      - name: 安装工作流插件依赖
        working-directory: ${{ env.SRC }}/plugins/packages/buildin/workflow
        run: |
          set -euo pipefail
          corepack enable pnpm || true
          corepack prepare pnpm@latest --activate || true
          pnpm install --frozen-lockfile || pnpm install

      - name: 安装仓库托管 TypeScript
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          npm install --prefix .ci-tools/typescript typescript@5.9.3 || true

      - name: 同步内置插件包
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          .venv/bin/python plugins/tools/sync_plugin_packages.py --source runtime --no-hot-reload
          base=core/crates/runtime/application/assets/plugins
          for spec in buildin/change_review buildin/character_cards buildin/workflow external/openui; do
            test -f "$base/$spec.toolpkg" && echo "ok $spec" || echo "MISS $spec"
          done

      - name: 构建检查
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          python3 tools/build_scripts/check_build_environment.py --products app --github-runner || true

      - name: 构建官方包
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          version=$(grep -E '^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+' apps/flutter/app/pubspec.yaml | head -1)
          name=$(printf '%s' "$version" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/')
          num=$(printf '%s' "$version" | sed -E 's/.*\+([0-9]+).*/\1/')
          echo "[版本] $name+$num"
          python3 tools/build_scripts/build_flutter_android.py \
            --build-name "$name" --build-number "$num" --enforce-lockfile

      - name: 收集官方包
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          find tools/release/dist -name '*.apk' 2>/dev/null | while read f; do cp "$f" "/tmp/out/official-$(basename "$f")"; done
          ls -lh /tmp/out/ || true

      - name: 构建云机包
        working-directory: ${{ env.SRC }}/apps/flutter/app/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleYunji --stacktrace --no-daemon --console=plain

      - name: 收集云机包并核对包名
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          find apps/flutter/app/android -name '*.apk' -path '*yunji*' | while read f; do cp "$f" "/tmp/out/yunji-$(basename "$f")"; done
          ls -lh /tmp/out/
          echo '=== 包名核对 ==='
          BT=$(ls "$ANDROID_HOME/build-tools" 2>/dev/null | sort -V | tail -1)
          if [ -n "$BT" ] && [ -x "$ANDROID_HOME/build-tools/$BT/aapt2" ]; then
            for f in /tmp/out/*.apk; do
              printf '%s -> ' "$f"; "$ANDROID_HOME/build-tools/$BT/aapt2" dump packagename "$f" 2>/dev/null || echo '(读取失败)'
            done
          else
            echo 'aapt2 不在 ANDROID_HOME，跳过'
          fi

      - name: 校验签名
        run: |
          set -euo pipefail
          BT=$(ls "$ANDROID_HOME/build-tools" 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then echo '无 build-tools，跳过'; exit 0; fi
          for f in /tmp/out/*.apk; do
            echo "--- $f"
            "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$f" 2>&1 | grep -E 'SHA-256|Signer' | head -3 || true
          done

      - name: 发布到 Release
        if: success() && github.event.inputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="build-${{ github.run_number }}"; fi
          cd /tmp/out
          ls -lh
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" ./*.apk --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "Operit2 $TAG" \
              --notes "源码 ${{ github.event.inputs.source_repo }}@${{ github.event.inputs.source_ref }}" \
              ./*.apk
          fi
          echo "发布完成: https://github.com/${{ github.repository }}/releases/tag/$TAG"