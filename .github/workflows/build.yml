name: Operit2 Android Build

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: '源码仓库'
        required: true
        default: 'CWIFISB1/Operit2'
      source_ref:
        description: '源码 ref'
        required: true
        default: 'main'
      publish_release:
        description: '构建成功后发布到 Release'
        required: true
        default: true
        type: boolean
      release_tag:
        description: 'Release 标签（留空自动）'
        required: false
        default: ''

permissions:
  contents: write

env:
  WORKSPACE: operit2-src

jobs:
  build-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: operit2-src
    steps:
      - name: Checkout upstream Operit2
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.source_repo }}
          ref: ${{ github.event.inputs.source_ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: operit2-src

      - name: Install Android runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison build-essential bzip2 ca-certificates curl diffutils \
            flex gawk gzip patch pkg-config tar unzip xz-utils

      - name: Checkout build patches
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: main
          path: build-patches

      # samba.org 的镜像在 CI 里一直 504/503，上游脚本无重试也无备用源。
      # 这份补丁加了重试与 talloc 镜像，下载后仍校验 SHA256，替换不了内容。
      - name: Apply patched source downloader
        run: |
          cp ../build-patches/patches/android-runtime/fetch_sources.ps1 \
             tools/android-runtime/fetch_sources.ps1
          grep -q Mirrors tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android runtime sources
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - name: Upload Android terminal runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: |
            operit2-src/apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/libbash.so
            operit2-src/apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_busybox.so
            operit2-src/apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so
            operit2-src/apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so
            operit2-src/apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
            operit2-src/apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 1

  build-android:
    needs: build-android-runtime
    runs-on: ubuntu-24.04
    # 首次构建要从源码编 V8（60~90 分钟），180 被强杀会导致 actions/cache
    # 的 post 步骤不执行，V8 缓存永远存不上，形成「超时→无缓存→再超时」死循环。
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
        working-directory: operit2-src
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout upstream Operit2
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.source_repo }}
          ref: ${{ github.event.inputs.source_ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: operit2-src

      - name: Download Android terminal runtime
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: operit2-src/apps/flutter/app/android/app/src/main

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl ninja-build pkg-config python3-venv unzip zip lld \
            libclang-dev libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev liblzma-dev \
            libwebkit2gtk-4.1-dev gcc-aarch64-linux-gnu libc6-dev-arm64-cross musl-tools

      - name: Install LLVM 21
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev libclang-21-dev
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libclang-21.so.21 /usr/lib/llvm-21/lib/libclang.so.21
          ls -l /usr/lib/llvm-21/lib/libclang.so.21

      - name: Configure libclang search path
        run: |
          echo "OPERIT_LIBCLANG_DIR=/usr/lib/llvm-21/lib" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> "$GITHUB_ENV"

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack pnpm shim
        run: |
          corepack enable pnpm
          command -v pnpm
          pnpm --version

      - name: Install built-in workflow plugin dependencies
        working-directory: operit2-src/plugins/packages/buildin/workflow
        run: |
          corepack pnpm install --frozen-lockfile
          for module in esbuild fflate typescript; do
            test -d "node_modules/$module" || { echo "missing $module" >&2; exit 1; }
          done

      - name: Create repository Python virtual environment
        run: |
          python3 -m venv .venv
          test -x .venv/bin/python
          .venv/bin/python --version

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install repository-managed TypeScript compiler
        run: |
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          test -x .ci-tools/typescript/node_modules/.bin/tsc
          .ci-tools/typescript/node_modules/.bin/tsc --version

      - name: Install FVM
        run: |
          dart pub global activate fvm $FVM_VERSION
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install project Flutter SDK
        working-directory: operit2-src/apps/flutter/app
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Restore Android signing material
        env:
          KEYSTORE_B64: ${{ secrets.O2_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.O2_KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.O2_KEYSTORE_ALIAS }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASS KEYSTORE_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2; exit 1
            fi
          done
          mkdir -p tools/release/secrets
          echo "$KEYSTORE_B64" | base64 -d > tools/release/secrets/operit2-release.keystore
          printf 'RELEASE_STORE_FILE=operit2-release.keystore\nRELEASE_STORE_PASSWORD=%s\nRELEASE_KEY_ALIAS=%s\nRELEASE_KEY_PASSWORD=%s\n' \
            "$KEYSTORE_PASS" "$KEYSTORE_ALIAS" "$KEYSTORE_PASS" \
            > tools/release/secrets/android-signing.properties
          keytool -list -keystore tools/release/secrets/operit2-release.keystore \
            -storepass "$KEYSTORE_PASS" > /dev/null
          keytool -list -v -keystore tools/release/secrets/operit2-release.keystore \
            -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -E 'SHA256:' | head -1

      - name: Install Emscripten for usearch wasm
        run: |
          # 上游在 11-07 之后把 resources/usearch.wasm 从仓库移除，改为构建时现场编译。
          # build.py 的查找顺序：EMXX → PATH 上的 em++ → .ci-tools/emsdk/upstream/emscripten/em++.py
          # 版本必须用 4.0.14（上游 edge/boards/esp32/editor/README.md 指定）：
          # latest(7.x) 的 libc++ 已移除 std::is_pod 与 std::uncaught_exceptions，usearch 会编译失败。
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .ci-tools/emsdk
          cd .ci-tools/emsdk
          ./emsdk install 4.0.14
          ./emsdk activate 4.0.14
          EMXX_PATH="$(pwd)/upstream/emscripten/em++"
          test -x "$EMXX_PATH"
          echo "EMXX=$EMXX_PATH" >> "$GITHUB_ENV"
          echo "$(pwd)/upstream/emscripten" >> "$GITHUB_PATH"
          "$EMXX_PATH" --version | head -1

      # actions/cache 的 save 只在 job 正常结束时执行，实测 Post 步骤报 success
      # 但仓库 caches 恒为 0（total_count=0），V8 缓存从未真正落地，于是每轮都
      # 从源码重编 60~90 分钟。改走 release 资产：产物只有 3 个文件加 manifest，
      # 预编译一次后永久复用，prepare_android_v8.py 的 cache_valid() 会自然跳过编译。
      - name: Restore V8 from release
        id: v8-restore
        shell: bash
        run: |
          set -uo pipefail
          H=$(sha256sum tools/build_scripts/prepare_android_v8.py \
                        apps/flutter/native/operit-flutter-bridge/Cargo.lock \
              | sha256sum | cut -c1-16)
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          ASSET="android-v8-$H.tar.gz"
          URL="https://github.com/CWIFISB1/operit-build/releases/download/prebuilt-deps/$ASSET"
          echo "[v8] probe $ASSET"
          if curl -fsSL -o /tmp/v8.tar.gz "$URL"; then
            mkdir -p tools/release/work/android-v8
            tar -xzf /tmp/v8.tar.gz -C tools/release/work/android-v8
            rm -f /tmp/v8.tar.gz
            echo "[v8] restored from release"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "[v8] no prebuilt asset, will compile from source"
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache source-built Android V8
        uses: actions/cache@v4
        with:
          path: tools/release/work/android-v8
          key: ${{ runner.os }}-${{ runner.arch }}-android-v8-${{ hashFiles('tools/build_scripts/prepare_android_v8.py', 'apps/flutter/native/operit-flutter-bridge/Cargo.lock') }}

      # Gradle 构建缓存。实测日志显示 assembleDebug + assembleYunji 一次跑要 47 分钟，
      # 而 GitHub 托管 runner 在第 47 分钟附近会被回收（注解恒为 The operation was canceled），
      # 连续四次全部断在 dexBuilderYunji。把 ~/.gradle/caches 持久化后，
      # 第二轮起增量编译只需十几分钟，稳定落在安全窗口内。
      - name: Cache Gradle build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/**/*.gradle*', 'src/gradle.properties', 'src/gradle/wrapper/gradle-wrapper.properties', 'src/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 缓存 Rust native 编译产物。实测 assembleRelease 单次 ~91 分钟，主因是
      # cargoBuildOperitFlutterBridge 每轮对 operit-flutter-bridge 全量重编
      # （target/ 目录从未进缓存，且 CARGO_INCREMENTAL=0）。缓存 target/ 后，
      # 未变更的依赖 crate 直接复用 fingerprint，Rust 段可从 ~90 分钟降到个位分钟级。
      - name: Cache Rust native build
        uses: actions/cache@v4
        with:
          path: |
            apps/flutter/native/operit-flutter-bridge/target
          key: rust-native-${{ runner.os }}-${{ hashFiles('apps/flutter/native/operit-flutter-bridge/Cargo.lock', 'apps/flutter/app/android/app/build.gradle.kts') }}
          restore-keys: |
            rust-native-${{ runner.os }}-

      - name: Check build environment
        run: python3 tools/build_scripts/check_build_environment.py --products app --github-runner

      - name: Sync builtin plugin packages
        run: |
          .venv/bin/python plugins/tools/sync_plugin_packages.py --source runtime --no-hot-reload
          base=core/crates/runtime/application/assets/plugins
          for collection in buildin external; do
            test -d "$base/$collection" || { echo "missing $base/$collection" >&2; exit 1; }
          done
          for spec in buildin/change_review buildin/character_cards buildin/workflow external/openui; do
            test -f "$base/$spec.toolpkg" || { echo "missing self-packed archive: $base/$spec.toolpkg" >&2; exit 1; }
            echo "self-packed ok: $spec"
          done

      - name: Build official APK
        run: |
          version=$(grep -E '^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+' apps/flutter/app/pubspec.yaml)
          count=$(printf '%s\n' "$version" | grep -c .)
          if [ "$count" -ne 1 ]; then
            echo "pubspec.yaml must contain exactly one release version line" >&2; exit 1
          fi
          build_name=$(printf '%s' "$version" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/')
          build_number=$(printf '%s' "$version" | sed -E 's/.*\+([0-9]+).*/\1/')
          python3 tools/build_scripts/build_flutter_android.py \
            --build-name "$build_name" --build-number "$build_number" --enforce-lockfile
          mkdir -p /tmp/out
          cp tools/release/dist/operit2-app-android-arm64-v8a-*.apk /tmp/out/app-official.apk

      - name: Publish V8 to release
        if: always() && steps.v8-restore.outputs.hit == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          # 旧版按固定路径判断 manifest.json，文件不在那儿就静默 exit 0，
          # 表现为「0 秒 success 但资产没落地」。改为直接找真实产物：
          # 只要 librusty_v8.a 存在就算本轮编出来了，其所在目录整体打包。
          FOUND=$(find . -name 'librusty_v8.a' -not -path '*/target/debug/*' 2>/dev/null | head -1)
          if [ -z "$FOUND" ]; then
            echo "[v8] 本轮没产出 librusty_v8.a，跳过上传"
            exit 0
          fi
          DIR=$(dirname "$FOUND")
          echo "[v8] found $FOUND in $DIR"
          ls -la "$DIR" | head -20
          H="${{ steps.v8-restore.outputs.hash }}"
          if [ -z "$H" ]; then
            H=$(sha256sum tools/build_scripts/prepare_android_v8.py \
                  apps/flutter/native/operit-flutter-bridge/Cargo.lock 2>/dev/null \
                | sha256sum | cut -c1-16)
          fi
          ASSET="android-v8-$H.tar.gz"
          tar -czf "/tmp/$ASSET" -C "$DIR" .
          echo "[v8] packed $(stat -c%s "/tmp/$ASSET") bytes as $ASSET"
          gh release view prebuilt-deps --repo CWIFISB1/operit-build >/dev/null 2>&1 \
            || gh release create prebuilt-deps --repo CWIFISB1/operit-build \
                 --title 'prebuilt deps' --notes 'Android prebuilt deps and V8 static libs'
          if gh release view prebuilt-deps --repo CWIFISB1/operit-build \
               --json assets --jq '.assets[].name' | grep -qx "$ASSET"; then
            echo "[v8] $ASSET exists, skip"
          else
            gh release upload prebuilt-deps "/tmp/$ASSET" --repo CWIFISB1/operit-build --clobber
            echo "[v8] uploaded $ASSET"
          fi
      - name: Build yunji APK
        run: |
          set -euo pipefail
          # 云机包与官方包走同一条 flutter build 路径，只多一个属性开关，
          # 因此 Dart AOT、assets、插件打包全部复用官方流程，不会缺任务。
          # 包名由 build.gradle.kts 里的 operitYunjiMode 在配置阶段换掉：
          #   主包   app.operit                -> com.yunjing.companion
          #   伴生包 app.operit.accessibility  -> com.yunjing.companion.accessibility
          version=$(grep -E '^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+' apps/flutter/app/pubspec.yaml)
          build_name=$(printf '%s' "$version" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/')
          build_number=$(printf '%s' "$version" | sed -E 's/.*\+([0-9]+).*/\1/')
          cd apps/flutter/app
          fvm flutter build apk --release \
            --target-platform android-arm64 \
            --android-project-arg=operitYunjiMode=true \
            --build-name "$build_name" --build-number "$build_number"

      # V8 从源码编译一次约 60~90 分钟，是 O2 构建时间的主要来源。本轮若发生了
      # 真实编译（Restore 步骤未命中），就地把产物打包上传到 release，下一轮
      # Restore 直接命中、prepare_android_v8.py 的 cache_valid() 跳过编译，
      # 总时长可压到 60 分钟以内。只传 3 个文件加 manifest，体积可控。
      - name: Collect and verify
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          # 两次 flutter build 都会写入同一个 release 输出目录，
          # 所以云机包构建前先把官方包挪走（已在 Build official APK 里复制到 /tmp/out）。
          ls -lh /tmp/out/
          echo "=== 云机包来源 ==="
          ls -lh apps/flutter/app/build/app/outputs/flutter-apk/ 2>/dev/null || true
          cp apps/flutter/app/build/app/outputs/flutter-apk/app-release.apk /tmp/out/app-yunji.apk
          ls -lh /tmp/out/
          BT=$(ls "$ANDROID_HOME/build-tools" 2>/dev/null | sort -V | tail -1)
          echo "=== 包名核对 ==="
          for f in /tmp/out/*.apk; do
            printf '%s -> ' "$(basename "$f")"
            "$ANDROID_HOME/build-tools/$BT/aapt2" dump packagename "$f" 2>/dev/null || echo "(读取失败)"
          done
          echo "=== 签名核对 ==="
          for f in /tmp/out/*.apk; do
            echo "--- $(basename "$f")"
            "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$f" 2>&1 | grep -E 'SHA-256' | head -1 || true
          done

      - name: Publish release
        if: success() && github.event.inputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="build-${{ github.run_number }}"; fi
          cd /tmp/out && ls -lh
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" ./*.apk --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "Operit2 $TAG" \
              --notes "源码 ${{ github.event.inputs.source_repo }}@${{ github.event.inputs.source_ref }}" \
              ./*.apk
          fi
          echo "完成: https://github.com/${{ github.repository }}/releases/tag/$TAG"